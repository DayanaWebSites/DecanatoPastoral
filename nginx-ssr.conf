proxy_cache_path /var/cache/nginx/decanato levels=1:2
                 keys_zone=decanato:10m max_size=200m inactive=60m use_temp_path=off;

map $request_uri $csp_public {
    default "default-src 'self'; img-src 'self' data: https://cdn.pastoralsocialdecanatodulcenombre.org; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

map $request_uri $csp_panel {
    default "default-src 'self'; img-src 'self' data: blob: https://cdn.pastoralsocialdecanatodulcenombre.org; style-src 'self'; font-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /health {
        access_log off;
        default_type text/plain;
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 'ok';
    }

    location /editar {
        proxy_pass http://127.0.0.1:4321;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $csp_panel always;
        add_header X-Cache-Status "BYPASS" always;
    }

    location /login {
        proxy_pass http://127.0.0.1:4321;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $csp_panel always;
    }

    location /auth {
        proxy_pass http://127.0.0.1:4321;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $csp_panel always;
    }

    location /api {
        proxy_pass http://127.0.0.1:4321;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache decanato;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Content-Security-Policy $csp_public always;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml
               application/rss+xml font/woff font/woff2;
}
